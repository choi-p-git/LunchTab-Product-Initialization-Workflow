[project]
name = "lunchtab-product-init"
version = "0.1.0"
description = "Build audited Lunchtab product import CSVs from menu builder and Odin item exports"
readme = "README.md"
authors = [
    { name = "choi-p-git", email = "choi-p-git@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pypdf>=6.14.2",
]

[project.scripts]
lt-prod-init = "lunchtab_product_init.gui:main"
lt-prod-init-cli = "lunchtab_product_init.workflow:main"
lt-pos-name = "lunchtab_product_init.pos_name_gui:main"
lt-pos-profile-infer = "lunchtab_product_init.pos_profile_inference:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
