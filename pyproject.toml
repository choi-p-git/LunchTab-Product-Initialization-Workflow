[project]
name = "lunchtab-product-init"
version = "0.1.0"
description = "Build audited Lunchtab product import CSVs from menu builder and Odin item exports"
readme = "README.md"
authors = [
    { name = "choi-p-git", email = "choi-p-git@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
]

[project.scripts]
lunchtab-product-init = "lunchtab_product_init.gui:main"
lunchtab-product-init-cli = "lunchtab_product_init.workflow:main"
lunchtab-pos-name = "lunchtab_product_init.pos_name_gui:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
